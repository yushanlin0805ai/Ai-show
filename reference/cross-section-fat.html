<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>剖面動畫範例：脂肪細胞變小（12 秒）</title>
<!--
  剖面動畫的風格範例（見 .claude/skills/broll-video/references/cross-section.md）。
  12 秒循環；網址加 ?t=6.5 會停在第 6.5 秒（抽格檢查用）。
  正式影片請照 broll-video 的流程改寫成 Hyperframes composition（GSAP timeline），畫法照抄這裡的 SVG。
-->
<style>
  @font-face { font-family: "Noto Sans TC"; font-weight: 400; src: url("../fonts/NotoSansTC-Regular.otf"); }
  @font-face { font-family: "Noto Sans TC"; font-weight: 700; src: url("../fonts/NotoSansTC-Bold.otf"); }
  @font-face { font-family: "Noto Sans TC"; font-weight: 900; src: url("../fonts/NotoSansTC-Black.otf"); }
  :root {
    --bg: #172A3A; --ink: #F4F1E8; --r3: #E9C46A; --muted: #B9C7D1; --hi: #FFFFFF;
  }
  html, body { margin: 0; height: 100%; background: #0E1A24; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage {
    position: relative; width: 1080px; height: 1920px; background: var(--bg); overflow: hidden;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--ink);
    transform-origin: center center;
  }
  #title { position: absolute; top: 230px; width: 100%; text-align: center; font-size: 96px; font-weight: 900; letter-spacing: .02em; }
  #card { position: absolute; left: 65px; top: 400px; width: 950px; height: 900px; border-radius: 32px; overflow: hidden; }
  #card svg { width: 100%; height: 100%; display: block; }
  .lbl { font: 700 36px "Noto Sans TC", sans-serif; fill: var(--ink); }
  .lead { stroke: var(--ink); stroke-opacity: .7; stroke-width: 3; fill: none; }
  .dot { fill: var(--ink); }
  #pill { position: absolute; left: 50%; top: 1150px; transform: translateX(-50%); background: var(--hi); color: var(--bg);
          font-size: 41px; font-weight: 900; padding: 13px 37px; border-radius: 60px; white-space: nowrap; }
  #fn { position: absolute; top: 1312px; width: 100%; text-align: center; font-size: 34px; font-weight: 700; color: var(--muted); }
  #cap { position: absolute; top: 1390px; left: 76px; right: 76px; text-align: center; font-size: 69px; font-weight: 700; line-height: 1.35; }
  #cap b { color: var(--r3); font-weight: 900; }
</style>
</head>
<body>
<div id="stage">
  <div id="title">脂肪去哪了？</div>
  <div id="card">
    <svg viewBox="0 0 950 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="dermis" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7A3536"/><stop offset="1" stop-color="#5E2729"/>
        </linearGradient>
        <pattern id="muscle" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
          <rect width="26" height="26" fill="#9E4444"/><rect width="7" height="26" fill="#B65A5A"/>
        </pattern>
        <clipPath id="fatClip"><rect x="0" y="470" width="950" height="320"/></clipPath>
      </defs>
      <rect id="air" width="950" height="900" fill="#1E2C3A"/>
      <g id="world">
        <g id="L-muscle"><rect x="0" y="790" width="950" height="200" fill="url(#muscle)"/></g>
        <g id="L-fat">
          <rect x="0" y="470" width="950" height="320" fill="#E9B24F" fill-opacity=".4"/>
          <g id="cells" clip-path="url(#fatClip)"></g>
        </g>
        <g id="L-dermis">
          <rect x="0" y="180" width="950" height="292" fill="url(#dermis)"/>
          <path d="M0 260 C 240 250, 480 272, 950 258 M0 330 C 300 342, 600 322, 950 336 M0 400 C 260 392, 620 410, 950 398"
                stroke="#000" stroke-opacity=".12" stroke-width="4" fill="none"/>
          <!-- 血管：一條就好 -->
          <rect x="-10" y="420" width="970" height="26" rx="13" fill="#C8423B"/>
          <rect x="-10" y="426" width="970" height="6" rx="3" fill="#fff" fill-opacity=".18"/>
        </g>
        <g id="L-epi">
          <path d="M0 150 C 120 138, 240 160, 360 148 S 600 136, 720 150 S 900 160, 950 146 L 950 186 L 0 186 Z" fill="#E8A79A"/>
        </g>
      </g>
      <!-- 標籤（不跟著鏡頭縮放，放在 world 外面） -->
      <g id="lb-epi" class="tag"><path class="lead" d="M40 95 L 40 120 L 200 160" pathLength="1"/><circle class="dot" cx="200" cy="160" r="8"/><text class="lbl" x="40" y="80">表皮</text></g>
      <g id="lb-der" class="tag"><path class="lead" d="M910 236 L 910 260 L 700 310" pathLength="1"/><circle class="dot" cx="700" cy="310" r="8"/><text class="lbl" x="910" y="222" text-anchor="end">真皮</text></g>
      <g id="lb-fat" class="tag"><path class="lead" d="M40 835 L 40 805 L 250 690" pathLength="1"/><circle class="dot" cx="250" cy="690" r="8"/><text class="lbl" x="40" y="872">皮下脂肪</text></g>
      <g id="lb-cell" class="tag"><path class="lead" d="M880 140 L 880 170 L 682 572" pathLength="1"/><circle class="dot" cx="682" cy="572" r="8"/><text class="lbl" x="880" y="126" text-anchor="end">脂肪細胞</text></g>
    </svg>
  </div>
  <div id="pill">細胞數量：一樣多</div>
  <div id="fn">Spalding et al., Nature, 2008</div>
  <div id="cap"></div>
</div>

<script>
const DUR = 12;
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = (p) => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

// 脂肪細胞：蜂巢排列
const NS = "http://www.w3.org/2000/svg", R = 44, cells = [];
for (let row = 0; row < 5; row++) {
  for (let col = -1; col < 13; col++) {
    const cx = col * 2 * R * 0.92 + (row % 2 ? R * 0.92 : 0) + 20, cy = 470 + R * 0.6 + row * R * 1.6;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", R * 0.95);
    c.setAttribute("fill", "#F2C76B"); c.setAttribute("stroke", "#C99A3E"); c.setAttribute("stroke-width", 4);
    $("#cells").appendChild(c); cells.push({ c, cx, cy, ph: (cx * 7 + cy * 3) % 6.28 });
  }
}
// 主角細胞：放大後落在畫面中央附近的那一顆
const ZO = { x: 475, y: 600 }, ZS = 1.7;
const hero = cells.reduce((best, k) => Math.hypot(k.cx - 560, k.cy - 610) < Math.hypot(best.cx - 560, best.cy - 610) ? k : best);
const ring = document.createElementNS(NS, "circle");
ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "#fff"); ring.setAttribute("stroke-width", 7);
$("#cells").appendChild(ring);
hero.c.setAttribute("fill", "#E9C46A");

const CAPS = [
  [0.0, "減肥的時候，<br>脂肪到底<b>去哪了</b>？"],
  [4.0, "脂肪就存在<br>皮膚底下的<b>脂肪細胞</b>裡"],
  [6.6, "變瘦的時候，<br>脂肪細胞會<b>變小</b>，"],
  [9.0, "但<b>數量</b>幾乎不會變少。"],
];
const show = (el, o, dy = 0) => { el.style.opacity = o; if (dy) el.style.translate = `0 ${dy}px`; };

function frame(t) {
  // 標題、卡片
  show($("#title"), easeOut(prog(t, 0, .5)) * (1 - prog(t, 3.6, 4.0)), 30 * (1 - easeOut(prog(t, 0, .5))));
  show($("#card"), easeOut(prog(t, .2, .8)), 40 * (1 - easeOut(prog(t, .2, .8))));
  // 各層由上而下出現
  [["#L-epi", .6], ["#L-dermis", .75], ["#L-fat", .9], ["#L-muscle", 1.05]].forEach(([s, a]) => {
    const p = easeOut(prog(t, a, a + .45)); $(s).style.opacity = p; $(s).style.transform = `translateY(${30 * (1 - p)}px)`;
  });
  // 引線標籤：跟著口播出現，0.4 秒畫線
  const tag = (id, a, b) => {
    const p = prog(t, a, a + .4), out = b ? prog(t, b, b + .3) : 0, g = $(id);
    g.style.opacity = (p > 0 ? 1 : 0) * (1 - out);
    g.querySelector(".lead").style.strokeDasharray = 1; g.querySelector(".lead").style.strokeDashoffset = 1 - easeOut(p);
    g.querySelector(".lbl").style.opacity = prog(t, a + .25, a + .5);
    g.querySelector(".dot").style.opacity = prog(t, a + .3, a + .4);
  };
  tag("#lb-epi", 1.6, 3.8); tag("#lb-der", 2.2, 3.8); tag("#lb-fat", 2.8, 3.8); tag("#lb-cell", 5.4, 11.6);
  // 鏡頭推近脂肪層
  const z = 1 + (ZS - 1) * easeIO(prog(t, 4.0, 5.2));
  $("#world").setAttribute("transform", `translate(${ZO.x} ${ZO.y}) scale(${z}) translate(${-ZO.x} ${-ZO.y})`);
  // 脂肪細胞變小（數量不變）＋呼吸
  const s = 1 - 0.38 * easeIO(prog(t, 6.6, 8.6));
  cells.forEach((k) => {
    const breathe = 1 + 0.015 * Math.sin(t * 2.2 + k.ph);
    k.c.setAttribute("r", R * 0.95 * s * breathe);
  });
  ring.setAttribute("cx", hero.cx); ring.setAttribute("cy", hero.cy);
  ring.setAttribute("r", R * 0.95 * s + 10 + 3 * Math.sin(t * 4));
  ring.style.opacity = prog(t, 5.4, 5.8);
  // 結論膠囊、出處
  const pp = easeOut(prog(t, 9.0, 9.4));
  $("#pill").style.opacity = pp; $("#pill").style.transform = `translateX(-50%) scale(${.8 + .2 * pp})`;
  show($("#fn"), prog(t, 9.0, 9.4));
  // 字幕
  const cap = CAPS.filter(([a]) => t >= a).pop();
  if ($("#cap").dataset.at !== String(cap[0])) { $("#cap").innerHTML = cap[1]; $("#cap").dataset.at = cap[0]; }
  // 循環前淡出
  $("#stage").style.opacity = 1 - prog(t, 11.6, 12);
}

function fit() {
  const k = Math.min(innerWidth / 1080, innerHeight / 1920);
  $("#stage").style.transform = `scale(${k})`;
}
addEventListener("resize", fit); fit();

const seek = new URLSearchParams(location.search).get("t");
if (seek !== null) frame(parseFloat(seek));
else { const t0 = performance.now(); (function loop(now) { frame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); })(t0); }
</script>
</body>
</html>
