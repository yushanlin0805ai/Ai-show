<title>2B 是什麼意思？｜衛教動畫示範</title>
<style>
:root{--bg:#172A3A;--ink:#F4F1E8;--r1:#E76F51;--r2:#F4A261;--r3:#E9C46A;--r4:#6C8EA4;--w:min(100vw,calc((100dvh - 84px)*9/16));color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0e1a24;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stage{position:relative;overflow:hidden;container-type:inline-size;aspect-ratio:9/16;width:var(--w);background:var(--bg)}
[data-t]{opacity:0;transition:opacity .35s,transform .45s}
[data-t].on{opacity:1}
#ttl{position:absolute;left:6cqw;top:8cqw;font-size:10cqw;font-weight:800;letter-spacing:.02em;transform:translateY(2cqw)}
#ttl.on{transform:none}
#lad{position:absolute;left:6cqw;right:6cqw;top:26cqw;display:grid;gap:3cqw}
.row{position:relative;height:25cqw;border-radius:3cqw;display:flex;align-items:center;color:var(--bg);transform:translateX(-5cqw)}
.row.on{transform:none}
.row b{display:block;font-size:7cqw;font-weight:800;line-height:1.1}
.row i{display:block;font-style:normal;font-size:3.6cqw;font-weight:600;margin-top:1cqw}
.lab{width:31cqw;padding-left:4cqw}
.slot{display:flex;gap:2cqw;flex:1}
.chip{width:17cqw;height:19cqw;border-radius:2.5cqw;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;font-size:3.3cqw;font-weight:700;transform:translateY(-8cqw) scale(.6);transition:opacity .3s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.chip.on{transform:none}
.chip span{font-size:8.5cqw;line-height:1}
.ring{position:absolute;inset:-1.6cqw;border:.9cqw solid #fff;border-radius:4.2cqw;pointer-events:none}
.ring.on{animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{inset:-2.4cqw}}
.q{position:absolute;right:-1.5cqw;top:-4cqw;width:8cqw;height:8cqw;border-radius:50%;background:#fff;color:var(--bg);font-size:6cqw;font-weight:800;display:grid;place-items:center}
.up{position:absolute;right:8cqw;top:77.4cqw;padding:1.2cqw 3.4cqw;border-radius:5cqw;background:#fff;color:var(--bg);font-size:3.8cqw;font-weight:800}
#cap{position:absolute;left:7cqw;right:7cqw;bottom:13cqw;height:19cqw}
#cap p{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:6.4cqw;line-height:1.35;font-weight:700}
#fn{position:absolute;left:7cqw;right:7cqw;bottom:5cqw;text-align:center;font-size:3.4cqw;color:#b9c7d1}
#big{position:absolute;left:50%;top:50%;translate:-50% -50%;padding:3.4cqw 7cqw;border:0;border-radius:8cqw;background:var(--ink);color:var(--bg);font:800 5.2cqw inherit;font-family:inherit;cursor:pointer}
#stage.go #big{display:none}
#bar{width:var(--w);display:flex;gap:10px;align-items:center;padding:0 4px}
#bar button{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:16px;cursor:pointer}
#sk{flex:1;accent-color:var(--r3)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){[data-t],.chip{transition:none}.ring.on{animation:none}}
</style></head><body>
<div id="stage">
 <h1 id="ttl" data-t="0.15">2B 是什麼意思？</h1>
 <div id="lad">
  <div class="row" data-t="1.8" style="background:var(--r1)"><div class="lab"><b>第 1 類</b><i>確定致癌</i></div><div class="slot"><div class="chip" data-t="13.7"><span>🍷</span>酒精</div></div></div>
  <div class="row" data-t="2.3" style="background:var(--r2)"><div class="lab"><b>2A</b><i>很可能致癌</i></div><div class="slot"><div class="chip" data-t="12.9"><span>🥩</span>紅肉</div></div></div>
  <div class="row" data-t="2.8" style="background:var(--r3)"><div class="lab"><b>2B</b><i>可能致癌</i></div>
   <div class="slot"><div class="chip" data-t="3.0"><span>🥤</span>阿斯巴甜</div><div class="chip" data-t="7.4"><span>🥒</span>醃漬蔬菜</div><div class="chip" data-t="9.6"><span>📱</span>手機射頻</div></div>
   <div class="ring" data-t="3.8"></div><div class="q" data-t="3.8">?</div></div>
  <div class="row" data-t="3.3" style="background:var(--r4)"><div class="lab"><b>第 3 類</b><i>無法分類</i></div></div>
 </div>
 <div class="up" data-t="15.1">▲ 更高等級</div>
 <div id="cap">
  <p data-t="0.15" data-e="1.8">那 2B 到底是什麼意思？</p>
  <p data-t="1.8" data-e="4.2">簡單來說，就是科學家發現了一些疑慮，</p>
  <p data-t="4.2" data-e="6.5">但目前證據還不夠確定</p>
  <p data-t="6.5" data-e="8.6">其實像是醃漬蔬菜，</p>
  <p data-t="8.6" data-e="10.6">還有手機通訊使用的射頻電磁場，</p>
  <p data-t="10.6" data-e="12.7">也都被列在 2B 類！</p>
  <p data-t="12.9" data-e="14.8">反而紅肉或者酒精的致癌風險分類</p>
  <p data-t="14.8" data-e="17.1">還在更高的等級</p>
 </div>
 <div id="fn" data-t="15.6">分類看的是證據強度，不是風險大小</div>

<script>
const A=document.getElementById('a'),S=document.getElementById('stage'),sk=document.getElementById('sk'),pp=document.getElementById('pp'),els=[...document.querySelectorAll('[data-t]')];
function render(t){els.forEach(e=>{const s=+e.dataset.t,x=e.dataset.e?+e.dataset.e:1e9;e.classList.toggle('on',t>=s&&t<x)});sk.value=t}
function loop(){render(A.currentTime);if(!A.paused)requestAnimationFrame(loop)}
function toggle(){if(A.ended||A.currentTime>=16.9)A.currentTime=0;A.paused?A.play():A.pause()}
A.onplay=()=>{S.classList.add('go');pp.textContent='❚❚';loop()};
A.onpause=()=>{pp.textContent='▶'};
sk.oninput=()=>{A.currentTime=+sk.value;render(+sk.value)};
document.getElementById('big').onclick=pp.onclick=toggle;
render(0);
</script></body></html>
